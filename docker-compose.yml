version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: repomindai-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/readyz"]
      interval: 5s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: repomindai-backend
    ports:
      - "8000:8000"
    volumes:
      - sqlite_data:/app/backend/data
    environment:
      - APP_ENV=production
      - JWT_SECRET=super-secret-key-change-in-prod-1234567890
      - ACCESS_TOKEN_EXPIRE_MINUTES=15
      - REFRESH_TOKEN_EXPIRE_DAYS=30
      - QDRANT_URL=http://qdrant:6333
      - LOG_LEVEL=INFO
      - RATE_LIMIT_RAG=10
      - RATE_LIMIT_AUTH=20
      - LLM_PROVIDER=mock
      - LLM_MODEL=mock-model
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")'"]
      interval: 5s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: repomindai-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 5s
      timeout: 5s
      retries: 3

volumes:
  qdrant_data:
  sqlite_data:
